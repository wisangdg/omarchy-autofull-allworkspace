<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c15"/>
      <stop offset="0.55" stop-color="#120f24"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f6dff"/>
      <stop offset="1" stop-color="#3fc8f2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fc8f2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3fc8f2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="250" rx="620" ry="430" fill="url(#glow)"/>
  <ellipse cx="1300" cy="720" rx="420" ry="320" fill="url(#glow2)"/>

  <!-- mock Omarchy bar -->
  <rect x="0" y="0" width="1600" height="56" fill="#ffffff" opacity="0.05"/>
  <rect x="0" y="56" width="1600" height="1" fill="#ffffff" opacity="0.08"/>
  <circle cx="40" cy="28" r="5" fill="#ffffff" opacity="0.22"/>
  <circle cx="64" cy="28" r="5" fill="#ffffff" opacity="0.22"/>
  <circle cx="88" cy="28" r="5" fill="#ffffff" opacity="0.45"/>
  <rect x="118" y="12" width="120" height="32" rx="8" fill="#ffffff" opacity="0.06"/>
  <text x="178" y="34" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="15" fill="#ffffff" opacity="0.45">active window</text>
  <g stroke="#c3b6ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="286" y="16" width="26" height="24" rx="6" opacity="0.0"/>
    <path d="M 296,19 L 288,19 L 288,27"/>
    <path d="M 302,19 L 310,19 L 310,27"/>
    <path d="M 288,33 L 288,41 L 296,41"/>
    <path d="M 310,33 L 310,41 L 302,41"/>
  </g>
  <circle cx="330" cy="28" r="4" fill="#54e6a0"/>
  <text x="800" y="35" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="17" fill="#ffffff" opacity="0.45">12:30</text>

  <!-- hero icon tile -->
  <g>
    <rect x="710" y="140" width="180" height="180" rx="44" fill="url(#tile)"/>
    <rect x="710" y="140" width="180" height="180" rx="44" fill="none" stroke="#ffffff" opacity="0.25"/>
    <g stroke="#ffffff" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 776,196 L 752,196 L 752,220"/>
      <path d="M 824,196 L 848,196 L 848,220"/>
      <path d="M 752,240 L 752,264 L 776,264"/>
      <path d="M 848,240 L 848,264 L 824,264"/>
    </g>
  </g>

  <text x="800" y="440" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="68" font-weight="700" fill="#f6f5ff">AutoFull Allworkspace</text>
  <text x="800" y="498" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="27" fill="#b7b3d8">Every new window opens fullscreen — controlled from the Omarchy bar</text>

  <!-- chips -->
  <g font-size="24">
    <g>
      <rect x="84" y="576" width="340" height="66" rx="16" fill="#ffffff" opacity="0.05"/>
      <rect x="84" y="576" width="340" height="66" rx="16" fill="none" stroke="#ffffff" opacity="0.13"/>
      <text x="254" y="617" text-anchor="middle" font-family="Noto Sans Mono, DejaVu Sans Mono, monospace" font-weight="700" fill="#c9c4ff">SUPER + ALT + X</text>
    </g>
    <g>
      <rect x="448" y="576" width="340" height="66" rx="16" fill="#ffffff" opacity="0.05"/>
      <rect x="448" y="576" width="340" height="66" rx="16" fill="none" stroke="#ffffff" opacity="0.13"/>
      <text x="618" y="617" text-anchor="middle" font-family="Noto Sans Mono, DejaVu Sans Mono, monospace" font-weight="700" fill="#c9c4ff">SUPER + F</text>
    </g>
    <g>
      <rect x="812" y="576" width="340" height="66" rx="16" fill="#ffffff" opacity="0.05"/>
      <rect x="812" y="576" width="340" height="66" rx="16" fill="none" stroke="#ffffff" opacity="0.13"/>
      <text x="982" y="617" text-anchor="middle" font-family="Noto Sans Mono, DejaVu Sans Mono, monospace" font-weight="700" fill="#c9c4ff">SUPER + ALT + F</text>
    </g>
    <g>
      <rect x="1176" y="576" width="340" height="66" rx="16" fill="#ffffff" opacity="0.05"/>
      <rect x="1176" y="576" width="340" height="66" rx="16" fill="none" stroke="#ffffff" opacity="0.13"/>
      <text x="1346" y="617" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-weight="700" fill="#c9c4ff">Right-click the icon</text>
    </g>
  </g>

  <text x="800" y="686" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="21" fill="#8b88a8">toggle on / off  ·  true fullscreen  ·  full width  ·  switch mode</text>

  <text x="800" y="790" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="20" fill="#6d6a88">AutoFull Allworkspace · an Omarchy shell bar plugin</text>
</svg>
